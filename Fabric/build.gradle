plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_version}"

    implementation("org.reflections:reflections:0.10.2")
    include("org.reflections:reflections:0.10.2")
    implementation("org.javassist:javassist:3.29.2-GA")
    include("org.javassist:javassist:3.29.2-GA")

    // GeckoLib
//    implementation files("libs/geckolib-fabric-1.20.1-${fabric_geckolib_version}.jar")
    implementation "maven.modrinth:geckolib:${geckolib_version_fabric}"

    // Fabric API + Loader
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}+${mc_version}"

    // ClothConfig
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version_fabric}"

    // ModMenu
    implementation ("com.terraformersmc:modmenu:${project.modmenu_version_fabric}") { transitive = false }
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}
