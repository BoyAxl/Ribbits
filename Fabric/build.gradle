plugins {
    id 'net.fabricmc.fabric-loom'
    id 'net.darkhax.curseforgegradle'
}

def releaseVersion = System.getenv('GITHUB_TAG')?.replaceFirst(/^v/, '') ?: project.version

group = maven_group
version = "${mc_version}-Fabric-${releaseVersion}"

base {
    archivesName = mod_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    main {
        java {
            srcDir '../Common/src/main/java'
            srcDir 'src/main/java'
        }
        resources {
            srcDir '../Common/src/main/resources'
            srcDir '../Common/src/generated/resources'
            srcDir 'src/main/resources'
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups("org.spongepowered")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_version}"

    implementation("org.reflections:reflections:0.10.2")
    include("org.reflections:reflections:0.10.2")
    implementation("org.javassist:javassist:3.29.2-GA")
    include("org.javassist:javassist:3.29.2-GA")

    implementation "maven.modrinth:geckolib:${geckolib_version_fabric}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}+${mc_version}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${clothconfig_version_fabric}"
    implementation("com.terraformersmc:modmenu:${modmenu_version_fabric}") {
        transitive = false
    }
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def expandProps = [
            "version"                   : version,
            "mc_version"                : mc_version,
            "mc_version_range_fabric"   : mc_version_range_fabric,
            "fabric_version"            : fabric_version,
            "fabric_loader_version"     : fabric_loader_version,
            "clothconfig_version_fabric": clothconfig_version_fabric,
            "geckolib_version_fabric"   : geckolib_version_fabric,
            "mod_full_name"             : mod_full_name,
            "mod_id"                    : mod_id,
            "license"                   : license,
            "mod_description"           : project.mod_description,
            "java_version"              : java_version
    ]

    inputs.properties(expandProps)

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand expandProps
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : mc_version
        ])
    }
}

sourcesJar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version.toInteger()
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

String[] compatibleVersions = compatible_versions.split(',')
task publishCurseForgeFabric(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn(tasks.jar)
    apiToken = curseforgeApiKey
    debugMode = debug_publish.toBoolean()

    def mainFile = upload(curseforge_project_id, tasks.jar.archiveFile)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : "No changelog provided"
    mainFile.releaseType = 'release'
    mainFile.addRequirement('fabric-api')
    mainFile.addRequirement('cloth-config')
    mainFile.addRequirement('geckolib')
    mainFile.addModLoader('fabric')
    mainFile.displayName = "${mod_full_name} [Fabric] ${releaseVersion} for ${mc_version}"
    compatibleVersions.each { mcVersion ->
        mainFile.addGameVersion(mcVersion)
    }
}
